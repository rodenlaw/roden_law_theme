<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-labelledby="sctruckwhodiedT sctruckwhodiedD" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="sctruckwhodiedT">Who died in truck-involved fatal crashes in South Carolina, 2020 to 2024</title>
<desc id="sctruckwhodiedD">In other vehicles: 503 (75.2%); In the large truck: 97 (14.5%); Pedestrians: 59 (8.8%); Cyclists: 10 (1.5%). Total 669 deaths. Source: NHTSA FARS.</desc>
<text x="0" y="22" font-size="15" font-weight="700" fill="var(--roden-text,#111)">Who died in truck-involved fatal crashes, South Carolina</text>
<text x="0" y="41" font-size="12.5" fill="var(--roden-muted,#555)">669 deaths, 2020&#8211;2024, by where the person was</text>
<text x="218" y="78" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">In other vehicles</text>
<rect x="230" y="58" width="360.0" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>In other vehicles: 503 (75.2%)</title></rect>
<text x="600.0" y="78" font-size="13" font-weight="600" fill="var(--roden-text,#111)">503 (75.2%)</text>
<text x="218" y="122" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">In the large truck</text>
<rect x="230" y="102" width="69.4" height="30" fill="var(--roden-bar,#4f93c4)" rx="3"><title>In the large truck: 97 (14.5%)</title></rect>
<text x="309.4" y="122" font-size="13" font-weight="600" fill="var(--roden-text,#111)">97 (14.5%)</text>
<text x="218" y="166" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Pedestrians</text>
<rect x="230" y="146" width="42.2" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Pedestrians: 59 (8.8%)</title></rect>
<text x="282.2" y="166" font-size="13" font-weight="600" fill="var(--roden-text,#111)">59 (8.8%)</text>
<text x="218" y="210" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Cyclists</text>
<rect x="230" y="190" width="7.2" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Cyclists: 10 (1.5%)</title></rect>
<text x="247.2" y="210" font-size="13" font-weight="600" fill="var(--roden-text,#111)">10 (1.5%)</text>
<text x="0" y="260" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
</svg>