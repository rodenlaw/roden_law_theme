<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="sctruckbyyearT sctruckbyyearD" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="sctruckbyyearT">Deaths in truck-involved fatal crashes in South Carolina, by year, 2020 to 2024</title>
<desc id="sctruckbyyearD">2020: 132 deaths in 113 truck-involved fatal crashes, 11.7 percent of all fatal crashes; 2021: 148 deaths in 131 truck-involved fatal crashes, 11.8 percent of all fatal crashes; 2022: 126 deaths in 120 truck-involved fatal crashes, 11.8 percent of all fatal crashes; 2023: 122 deaths in 111 truck-involved fatal crashes, 11.4 percent of all fatal crashes; 2024: 141 deaths in 126 truck-involved fatal crashes, 13.3 percent of all fatal crashes. Source: NHTSA FARS.</desc>
<text x="0" y="22" font-size="15" font-weight="700" fill="var(--roden-text,#111)">Deaths in truck-involved fatal crashes, South Carolina</text>
<text x="0" y="41" font-size="12.5" fill="var(--roden-muted,#555)">Per year. Below each year: truck-involved crashes as a share of all fatal crashes</text>
<rect x="47.2" y="82.8" width="81.6" height="171.2" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2020: 132 deaths, 113 crashes</title></rect>
<text x="88.0" y="74.8" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">132</text>
<text x="88.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2020</text>
<text x="88.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">11.7%</text>
<rect x="183.2" y="62.0" width="81.6" height="192.0" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2021: 148 deaths, 131 crashes</title></rect>
<text x="224.0" y="54.0" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">148</text>
<text x="224.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2021</text>
<text x="224.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">11.8%</text>
<rect x="319.2" y="90.5" width="81.6" height="163.5" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2022: 126 deaths, 120 crashes</title></rect>
<text x="360.0" y="82.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">126</text>
<text x="360.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2022</text>
<text x="360.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">11.8%</text>
<rect x="455.2" y="95.7" width="81.6" height="158.3" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2023: 122 deaths, 111 crashes</title></rect>
<text x="496.0" y="87.7" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">122</text>
<text x="496.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2023</text>
<text x="496.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">11.4%</text>
<rect x="591.2" y="71.1" width="81.6" height="182.9" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2024: 141 deaths, 126 crashes</title></rect>
<text x="632.0" y="63.1" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">141</text>
<text x="632.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2024</text>
<text x="632.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">13.3%</text>
<text x="0" y="312" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
</svg>