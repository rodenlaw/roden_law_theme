<title id="yrTitle">Fatal crashes per year on I-26 and I-95 in Georgia and South Carolina</title>
<desc id="yrDesc">2020: 67 fatal crashes, 25 involving a large truck; 2021: 84 fatal crashes, 29 involving a large truck; 2022: 64 fatal crashes, 25 involving a large truck; 2023: 62 fatal crashes, 14 involving a large truck; 2024: 46 fatal crashes, 16 involving a large truck.</desc>
