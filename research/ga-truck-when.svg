<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-labelledby="gatruckwhenT gatruckwhenD" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="gatruckwhenT">When truck-involved fatal crashes happen in Georgia, compared with other fatal crashes</title>
<desc id="gatruckwhenD">Truck-involved: 6 a.m. to 6 p.m.: 61.3%; Other fatal crashes: 6 a.m. to 6 p.m.: 41.9%; Truck-involved: Monday to Friday: 83.2%; Other fatal crashes: Monday to Friday: 64.9%. Source: NHTSA FARS 2020 to 2024.</desc>
<text x="0" y="22" font-size="15" font-weight="700" fill="var(--roden-text,#111)">Truck-involved fatal crashes skew to daytime and weekdays, Georgia</text>
<text x="0" y="41" font-size="12.5" fill="var(--roden-muted,#555)">Share of fatal crashes in daytime hours and on weekdays, 2020&#8211;2024</text>
<text x="278" y="78" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Truck-involved: 6 a.m.&#8211;6 p.m.</text>
<rect x="290" y="58" width="221.0" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Truck-involved: 6 a.m.&#8211;6 p.m.: 61.3%</title></rect>
<text x="521.0" y="78" font-size="13" font-weight="600" fill="var(--roden-text,#111)">61.3%</text>
<text x="278" y="122" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Other fatal crashes: 6 a.m.&#8211;6 p.m.</text>
<rect x="290" y="102" width="151.1" height="30" fill="var(--roden-bar,#4f93c4)" rx="3"><title>Other fatal crashes: 6 a.m.&#8211;6 p.m.: 41.9%</title></rect>
<text x="451.1" y="122" font-size="13" font-weight="600" fill="var(--roden-text,#111)">41.9%</text>
<text x="278" y="166" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Truck-involved: Monday&#8211;Friday</text>
<rect x="290" y="146" width="300.0" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Truck-involved: Monday&#8211;Friday: 83.2%</title></rect>
<text x="600.0" y="166" font-size="13" font-weight="600" fill="var(--roden-text,#111)">83.2%</text>
<text x="278" y="210" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Other fatal crashes: Monday&#8211;Friday</text>
<rect x="290" y="190" width="234.0" height="30" fill="var(--roden-bar,#4f93c4)" rx="3"><title>Other fatal crashes: Monday&#8211;Friday: 64.9%</title></rect>
<text x="534.0" y="210" font-size="13" font-weight="600" fill="var(--roden-text,#111)">64.9%</text>
<text x="0" y="260" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
</svg>