<text x="242.0" y="254" font-size="13" font-weight="600" fill="var(--roden-text,#111)">2 (0.2%)</text>
<text x="0" y="304" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
