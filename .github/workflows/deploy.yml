name: Deploy to WP Engine

on:
  push:
    branches:
      - main
    paths:
      - 'wordpress/**'
  # Allow manual re-deploy from the Actions tab (handy for cache flushes,
  # rolling forward after a non-wordpress/ commit, or testing prod auth).
  workflow_dispatch:
    inputs:
      allow_drift:
        description: 'Deploy even if production has uncommitted edits (DESTROYS them)'
        type: boolean
        default: false

concurrency:
  group: deploy-wpengine
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Theme to WP Engine (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        env:
          WPE_KEY: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_GATEWAY_KEY: ${{ secrets.WPE_GATEWAY_KEY_PRIVATE }}
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: guarantees exactly one trailing newline, which
          # OpenSSH requires. Written via env rather than direct interpolation
          # so the value never becomes part of the script text.
          printf '%s\n' "$WPE_KEY" > ~/.ssh/wpe_key
          chmod 600 ~/.ssh/wpe_key
          # Fingerprint only — never the key. Confirms the secret survived
          # transfer and identifies which key CI is actually using.
          if ssh-keygen -lf ~/.ssh/wpe_key; then
            echo "Key loaded OK (fingerprint above)."
          else
            echo "::error::The private key in WPE_SSHG_KEY_PRIVATE is malformed or truncated."
            exit 1
          fi
          # Separate key for the SSH gateway. WP Engine keeps two independent
          # key registries — git deploy keys are per-environment, gateway keys
          # are per-user account — and a key in one is NOT valid in the other.
          # Optional: if unset, the drift check simply reports itself inactive.
          if [ -n "${WPE_GATEWAY_KEY:-}" ]; then
            printf '%s\n' "$WPE_GATEWAY_KEY" > ~/.ssh/wpe_gateway_key
            chmod 600 ~/.ssh/wpe_gateway_key
            ssh-keygen -lf ~/.ssh/wpe_gateway_key >/dev/null 2>&1 \
              && echo "Gateway key loaded OK." \
              || echo "::warning::WPE_GATEWAY_KEY_PRIVATE is malformed — drift check will be inactive."
          fi

          ssh-keyscan -t rsa git.wpengine.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOL
          Host git.wpengine.com
            IdentityFile ~/.ssh/wpe_key
            StrictHostKeyChecking no
            IdentitiesOnly yes
          EOL

      # ─────────────────────────────────────────────────────────────────────
      # Drift guard.
      #
      # The deploy below force-pushes, so anything edited on the server and not
      # committed here is destroyed without warning. That has happened: 28 theme
      # files were edited over SSH between 2026-07-10 and 07-31 while this repo
      # sat untouched, and were one workflow run from being erased.
      #
      # The comparison is production-on-disk vs THE TREE WE LAST DEPLOYED (the
      # WPE remote's main), NOT vs this commit — comparing against this commit
      # would flag every legitimate change and block all deploys.
      #
      # Any difference means someone edited the server directly. Fails closed on
      # real drift; fails OPEN if the check itself cannot run, so an SSH or
      # tooling problem can never block a deploy.
      # ─────────────────────────────────────────────────────────────────────
      - name: Detect production drift
        id: drift
        continue-on-error: true
        run: |
          set -o pipefail
          GW=rodenlawprod@rodenlawprod.ssh.wpengine.net
          THEME=wp-content/themes/roden-law

          ssh-keyscan -t rsa,ecdsa,ed25519 rodenlawprod.ssh.wpengine.net >> ~/.ssh/known_hosts 2>/dev/null || true

          git remote add wpe-prod git@git.wpengine.com:rodenlawprod.git 2>/dev/null || true
          if ! git fetch -q wpe-prod main; then
            echo "::warning::Could not fetch the deployed tree from WP Engine — drift check skipped."
            exit 0
          fi

          mkdir -p /tmp/deployed
          git archive FETCH_HEAD | tar x -C /tmp/deployed || {
            echo "::warning::Could not extract the deployed tree — drift check skipped."; exit 0; }

          if [ ! -f ~/.ssh/wpe_gateway_key ]; then
            echo "::warning::Drift check INACTIVE — WPE_GATEWAY_KEY_PRIVATE is not set."
            {
              echo "### ⚠️ Drift check did not run"
              echo
              echo "`WPE_GATEWAY_KEY_PRIVATE` is not set, so **production was not checked**."
              echo "Set it to a key registered on the WP Engine SSH gateway for `rodenlawprod`."
              echo "It is a *different* registry from the git deploy key in `WPE_SSHG_KEY_PRIVATE`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The remote script goes over stdin, NOT as an ssh argument. Passing it
          # as an argument makes the remote shell re-parse it, and the theme
          # contains a directory with a space in its name ("blog images"), which
          # word-splits and breaks find's expression — silently yielding zero
          # files, so every deploy looks like total drift. Learned the hard way.
          if ! ssh -i ~/.ssh/wpe_gateway_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
                   -o BatchMode=yes -o ConnectTimeout=20 "$GW" 'bash -s' > /tmp/prod.md5 2>/dev/null <<'REMOTE'
          cd ~/sites/rodenlawprod/wp-content/themes/roden-law || exit 1
          find . -type f ! -path './blog images/*' ! -name '*.bak*' ! -name '.DS_Store' \
            -exec md5sum {} + | sort -k2
          REMOTE
          then
            echo "::warning::Drift check INACTIVE — could not reach the SSH gateway."
            {
              echo "### ⚠️ Drift check did not run"
              echo
              echo "Could not reach the gateway, so **this deploy was not checked against production**."
              echo "Confirm the `WPE_GATEWAY_KEY_PRIVATE` key is registered under"
              echo "WPE Portal → *SSH Gateway* for the `rodenlawprod` environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -s /tmp/prod.md5 ]; then
            echo "::warning::Drift check INACTIVE — the production listing came back empty."
            {
              echo "### ⚠️ Drift check did not run"
              echo
              echo "The gateway responded but returned no files, so no comparison was possible."
              echo "Treating this as inconclusive rather than as total drift."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ( cd "/tmp/deployed/$THEME" \
            && find . -type f ! -path './blog images/*' ! -name '*.bak*' ! -name '.DS_Store' \
                 -exec md5sum {} + | sort -k2 ) > /tmp/deployed.md5

          if diff -q /tmp/deployed.md5 /tmp/prod.md5 >/dev/null; then
            echo "No drift: production matches the last deployed tree ($(wc -l < /tmp/prod.md5) files)."
            exit 0
          fi

          echo "drifted=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Production has drifted from the last deployed tree"
            echo
            echo "Files edited on the server and never committed. **Deploying now destroys them.**"
            echo
            echo "\`<\` only in the deployed tree · \`>\` only on / differing on production"
            echo
            echo '```'
            diff /tmp/deployed.md5 /tmp/prod.md5 | grep '^[<>]' | awk '{print $1, $3}' | sort -u -k2 | head -60
            echo '```'
            echo
            echo "Commit the drift first. To deploy anyway and discard it, re-run with **allow_drift**."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Stop if production has uncommitted edits
        if: steps.drift.outcome == 'failure' && inputs.allow_drift != true
        run: |
          echo "::error::Production has uncommitted edits that this deploy would destroy. See the job summary. Commit them, or re-run with allow_drift to discard."
          exit 1

      # `git subtree split` extracts the wordpress/ subtree so its contents
      # become the root of the pushed tree, which is what WPE expects.
      - name: Build deploy branch (subtree split of wordpress/)
        run: git subtree split --prefix=wordpress -b deploy-branch

      # Prod requires the WPE_SSHG_KEY public key to be registered on the
      # rodenlawprod environment in the WP Engine portal. If this step
      # fails with "Permission denied (publickey)", add the public key
      # under: WPE Portal → rodenlawprod → SSH Gateway → Add SSH Key.
      - name: Deploy to prod (rodenlawprod)
        run: |
          # The drift-check step may already have added this remote.
          git remote add wpe-prod git@git.wpengine.com:rodenlawprod.git 2>/dev/null || true
          git push wpe-prod deploy-branch:main --force
