<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="gatruckbyyearT gatruckbyyearD" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="gatruckbyyearT">Deaths in truck-involved fatal crashes in Georgia, by year, 2020 to 2024</title>
<desc id="gatruckbyyearD">2020: 236 deaths in 211 truck-involved fatal crashes, 13.9 percent of all fatal crashes; 2021: 247 deaths in 224 truck-involved fatal crashes, 13.3 percent of all fatal crashes; 2022: 271 deaths in 243 truck-involved fatal crashes, 14.5 percent of all fatal crashes; 2023: 194 deaths in 177 truck-involved fatal crashes, 11.9 percent of all fatal crashes; 2024: 203 deaths in 187 truck-involved fatal crashes, 14.3 percent of all fatal crashes. Source: NHTSA FARS.</desc>
<text x="0" y="22" font-size="15" font-weight="700" fill="var(--roden-text,#111)">Deaths in truck-involved fatal crashes, Georgia</text>
<text x="0" y="41" font-size="12.5" fill="var(--roden-muted,#555)">Per year. Below each year: truck-involved crashes as a share of all fatal crashes</text>
<rect x="47.2" y="86.8" width="81.6" height="167.2" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2020: 236 deaths, 211 crashes</title></rect>
<text x="88.0" y="78.8" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">236</text>
<text x="88.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2020</text>
<text x="88.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">13.9%</text>
<rect x="183.2" y="79.0" width="81.6" height="175.0" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2021: 247 deaths, 224 crashes</title></rect>
<text x="224.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">247</text>
<text x="224.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2021</text>
<text x="224.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">13.3%</text>
<rect x="319.2" y="62.0" width="81.6" height="192.0" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2022: 271 deaths, 243 crashes</title></rect>
<text x="360.0" y="54.0" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">271</text>
<text x="360.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2022</text>
<text x="360.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">14.5%</text>
<rect x="455.2" y="116.6" width="81.6" height="137.4" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2023: 194 deaths, 177 crashes</title></rect>
<text x="496.0" y="108.6" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">194</text>
<text x="496.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2023</text>
<text x="496.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">11.9%</text>
<rect x="591.2" y="110.2" width="81.6" height="143.8" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>2024: 203 deaths, 187 crashes</title></rect>
<text x="632.0" y="102.2" text-anchor="middle" font-size="13" font-weight="600" fill="var(--roden-text,#111)">203</text>
<text x="632.0" y="272.0" text-anchor="middle" font-size="12.5" fill="var(--roden-text,#111)">2024</text>
<text x="632.0" y="289.0" text-anchor="middle" font-size="11.5" fill="var(--roden-muted,#555)">14.3%</text>
<text x="0" y="312" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
</svg>