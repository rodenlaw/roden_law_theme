<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-labelledby="sctruckwhenT sctruckwhenD" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="sctruckwhenT">When truck-involved fatal crashes happen in South Carolina, compared with other fatal crashes</title>
<desc id="sctruckwhenD">Truck-involved: 6 a.m. to 6 p.m.: 63.7%; Other fatal crashes: 6 a.m. to 6 p.m.: 39.4%; Truck-involved: Monday to Friday: 85.4%; Other fatal crashes: Monday to Friday: 63.2%. Source: NHTSA FARS 2020 to 2024.</desc>
<text x="0" y="22" font-size="15" font-weight="700" fill="var(--roden-text,#111)">Truck-involved fatal crashes skew to daytime and weekdays, South Carolina</text>
<text x="0" y="41" font-size="12.5" fill="var(--roden-muted,#555)">Share of fatal crashes in daytime hours and on weekdays, 2020&#8211;2024</text>
<text x="278" y="78" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Truck-involved: 6 a.m.&#8211;6 p.m.</text>
<rect x="290" y="58" width="223.8" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Truck-involved: 6 a.m.&#8211;6 p.m.: 63.7%</title></rect>
<text x="523.8" y="78" font-size="13" font-weight="600" fill="var(--roden-text,#111)">63.7%</text>
<text x="278" y="122" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Other fatal crashes: 6 a.m.&#8211;6 p.m.</text>
<rect x="290" y="102" width="138.4" height="30" fill="var(--roden-bar,#4f93c4)" rx="3"><title>Other fatal crashes: 6 a.m.&#8211;6 p.m.: 39.4%</title></rect>
<text x="438.4" y="122" font-size="13" font-weight="600" fill="var(--roden-text,#111)">39.4%</text>
<text x="278" y="166" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Truck-involved: Monday&#8211;Friday</text>
<rect x="290" y="146" width="300.0" height="30" fill="var(--roden-accent,#0b5c8a)" rx="3"><title>Truck-involved: Monday&#8211;Friday: 85.4%</title></rect>
<text x="600.0" y="166" font-size="13" font-weight="600" fill="var(--roden-text,#111)">85.4%</text>
<text x="278" y="210" text-anchor="end" font-size="13" fill="var(--roden-text,#111)">Other fatal crashes: Monday&#8211;Friday</text>
<rect x="290" y="190" width="222.0" height="30" fill="var(--roden-bar,#4f93c4)" rx="3"><title>Other fatal crashes: Monday&#8211;Friday: 63.2%</title></rect>
<text x="522.0" y="210" font-size="13" font-weight="600" fill="var(--roden-text,#111)">63.2%</text>
<text x="0" y="260" font-size="11" fill="var(--roden-muted,#555)">Source: NHTSA Fatality Analysis Reporting System, 2020&#8211;2024 annual files. Fatal crashes only; 2024 file may be revised.</text>
</svg>